<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>3dmax</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
body {
    font-family: "Microsoft YaHei", "微软雅黑", Arial, sans-serif;
    background: #f0f0f0;
    padding: 15px;
}
.item {
    background: #ffffff;
    border: 2px solid #888;
    padding: 12px;
    margin-bottom: 15px;
}
.view-box {
    width: 100%;
    max-width: 700px;
    margin: 0 auto;
    background: #ffffff;
    border: 1px solid #bbb;
    /* 不固定比例！由js控制 */
}
.desc {
    margin-top: 12px;
    line-height: 1.8;
    font-size: 15px;
    color: #222;
}
</style>
</head>
<body>

<div class="item">
    <div class="view-box" id="box1"></div>
    <div class="desc">
        <strong>沙发模型</strong><br>
        本作品参照抖音 @3dmax效果图教学 的教程完成建模。<br>
        不足之处：模型部分结构布线分配不够合理，转角位置布线杂乱；仅简单赋予单色，缺少细节表现，整体效果比较单调。
    </div>
</div>

<div class="item">
    <div class="view-box" id="box2"></div>
    <div class="desc">
        <strong>书架模型</strong>
    </div>
</div>

<div class="item">
    <div class="view-box" id="box3"></div>
    <div class="desc">
        <strong>电脑键盘鼠标模型</strong><br>
        空格键是长条形状，分段不够，加了切角和涡轮平滑之后角变尖了，跟别的按键样子不一样。下次做这种长模型要留意分段数量。
    </div>
</div>

<div class="item">
    <div class="view-box" id="box4"></div>
    <div class="desc">
        <strong>小房子模型</strong>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<script>
function createModel(containerId, glbFile, type) {
    const dom = document.getElementById(containerId);
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xffffff);

    const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
    if (type === "sofa") {
        camera.position.set(4, 3, 9);
    } else if (type === "pcset") {
        camera.position.set(3, 2.2, 6);
    } else if (type === "house") {
        camera.position.set(-4, 2.8, 4.5);
    } else {
        camera.position.set(2.5, 2, 5.5);
    }

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    dom.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.enableRotate = true;
    controls.enableZoom = true;
    controls.enablePan = true;

    const ambientIntensity = type === "sofa" ? 1.8 : (type === "pcset" ? 1.4 : 0.88);
    const ambient = new THREE.AmbientLight(0xffffff, ambientIntensity);
    scene.add(ambient);

    const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 1.4);
    scene.add(hemi);

    const keyLight = new THREE.DirectionalLight(0xffffff, 1.8);
    keyLight.position.set(5, 8, 6);
    scene.add(keyLight);

    const fillLight1 = new THREE.DirectionalLight(0xffffff, 1.2);
    fillLight1.position.set(-5, 4, -4);
    scene.add(fillLight1);

    const fillLight2 = new THREE.DirectionalLight(0xffffff, 1.0);
    fillLight2.position.set(0, -3, 4);
    scene.add(fillLight2);

    const loader = new THREE.GLTFLoader();
    loader.load(
        glbFile,
        function (res) {
            const model = res.scene;
            scene.add(model);
            const box = new THREE.Box3().setFromObject(model);
            const center = box.getCenter(new THREE.Vector3());
            model.position.sub(center);
            controls.target.set(0,0,0);
            controls.update();

            const size = new THREE.Vector3();
            box.getSize(size);
            const modelRatio = size.x / size.y;

            const baseW = dom.clientWidth;
            const canvasW = baseW;
            const canvasH = canvasW / modelRatio;

            renderer.setSize(canvasW, canvasH);
            camera.aspect = canvasW / canvasH;
            camera.updateProjectionMatrix();
        },
        undefined,
        function (err) {
            console.error(err);
        }
    );

    function render() {
        requestAnimationFrame(render);
        controls.update();
        renderer.render(scene, camera);
    }
    render();
}

createModel("box1", "sofa.glb", "sofa");
createModel("box2", "bookshelf.glb", "shelf");
createModel("box3", "THREE.glb", "pcset");
createModel("box4", "home.glb", "house");
</script>
</body>
</html>
