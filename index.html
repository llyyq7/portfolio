<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>3dmax</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
body {
  font-family: "Microsoft YaHei", "微软雅黑", Arial, sans-serif;
  background: #f0f0f0;
  padding: 15px;
}
.item {
  background: #ffffff;
  border: 2px solid #888;
  padding: 12px;
  margin-bottom: 15px;
}
.view-box {
  width: 100%;
  height: 340px;
  background: #ffffff;
  border: 1px solid #bbb;
}
.desc {
  margin-top: 12px;
  line-height: 1.8;
  font-size: 15px;
  color: #222;
}
</style>
</head>
<body>
<div class="item">
  <div class="view-box" id="box1"></div>
  <div class="desc">
    <strong>沙发模型</strong><br>
    本作品参照抖音 @3dmax效果图教学 的教程完成建模。<br>
    不足之处：模型布线存在缺陷，部分结构段数分配不合理，转角位置布线杂乱；模型整体细节较少，材质质感表现不够细腻。
  </div>
</div>

<div class="item">
  <div class="view-box" id="box2"></div>
  <div class="desc">
    <strong>书架模型</strong>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
function createModel(containerId, glbFile, type) {
  const dom = document.getElementById(containerId);
  const w = dom.clientWidth;
  const h = dom.clientHeight;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xffffff);

  const camera = new THREE.PerspectiveCamera(45, w / h, 0.1, 1000);

  if (type === "sofa") {
    camera.position.set(4, 3, 9);
  } else {
    camera.position.set(2.5, 2, 5.5);
  }

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(w, h);
  renderer.setPixelRatio(window.devicePixelRatio);
  dom.appendChild(renderer.domElement);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.enableRotate = true;
  controls.enableZoom = true;
  controls.enablePan = true;

  const ambient = new THREE.AmbientLight(0xffffff, 0.75);
  scene.add(ambient);

  const hemi = new THREE.HemisphereLight(0xffffff, 0xe2e2e2, 1.1);
  scene.add(hemi);

  const keyLight = new THREE.DirectionalLight(0xffffff, 1.1);
  keyLight.position.set(5, 8, 6);
  scene.add(keyLight);

  const fillLight1 = new THREE.DirectionalLight(0xffffff, 0.85);
  fillLight1.position.set(-5, 4, -4);
  scene.add(fillLight1);

  const fillLight2 = new THREE.DirectionalLight(0xffffff, 0.65);
  fillLight2.position.set(0, -3, 4);
  scene.add(fillLight2);

  // 只给沙发模型额外加强一档暗部补光
  if (type === "sofa") {
    const sofaBoostLight = new THREE.DirectionalLight(0xffffff, 0.5);
    sofaBoostLight.position.set(-3, 6, 8);
    scene.add(sofaBoostLight);

    const sofaFillLight = new THREE.DirectionalLight(0xffffff, 0.35);
    sofaFillLight.position.set(0, 2, -6);
    scene.add(sofaFillLight);
  }

  const loader = new THREE.GLTFLoader();
  loader.load(
    glbFile,
    function (res) {
      const model = res.scene;
      scene.add(model);
      controls.target.copy(model.position);
      controls.update();
      console.log(glbFile + " 加载成功");
    },
    undefined,
    function (err) {
      console.error(glbFile + " 加载失败", err);
    }
  );

  function render() {
    requestAnimationFrame(render);
    controls.update();
    renderer.render(scene, camera);
  }
  render();

  window.addEventListener("resize", function () {
    const nw = dom.clientWidth;
    const nh = dom.clientHeight;
    camera.aspect = nw / nh;
    camera.updateProjectionMatrix();
    renderer.setSize(nw, nh);
  });
}

createModel("box1", "sofa.glb", "sofa");
createModel("box2", "bookshelf.glb", "shelf");
</script>
</body>
</html>
