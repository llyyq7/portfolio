<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>3dmax</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
body {
  font-family: "Microsoft YaHei", "微软雅黑", Arial, sans-serif;
  background: #f0f0f0;
  padding: 15px;
}
.item {
  background: #ffffff;
  border: 2px solid #888;
  padding: 12px;
  margin-bottom: 15px;
}
.view-box {
  width: 100%;
  max-width: 700px;
  margin: 0 auto;
  background: #ffffff;
  border: 1px solid #bbb;
  /* 不固定比例！由js控制 */
}
.desc {
  margin-top: 12px;
  line-height: 1.8;
  font-size: 15px;
  color: #222;
}
</style>
</head>
<body>

<div class="item">
  <div class="view-box" id="box1"></div>
  <div class="desc">
    <strong>沙发模型</strong><br>
    本作品参照抖音 @3dmax效果图教学 的教程完成建模。<br>
    不足之处：模型布线存在缺陷，部分结构段数分配不合理，转角位置布线杂乱；模型整体细节较少，材质质感表现不够细腻。
  </div>
</div>

<div class="item">
  <div class="view-box" id="box2"></div>
  <div class="desc">
    <strong>书架模型</strong>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>

function createModel(containerId, glbFile, type) {
  const dom = document.getElementById(containerId);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xffffff);

  const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
  if (type === "sofa") {
    camera.position.set(4, 3, 9);
  } else {
    camera.position.set(2.5, 2, 5.5);
  }

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  dom.appendChild(renderer.domElement);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.enableRotate = true;
  controls.enableZoom = true;
  controls.enablePan = true;

  const ambientIntensity = type === "sofa" ? 1.0 : 0.88;
  const ambient = new THREE.AmbientLight(0xffffff, ambientIntensity);
  scene.add(ambient);

  const hemi = new THREE.HemisphereLight(0xffffff, 0xe2e2e2, 1.2);
  scene.add(hemi);

  const keyLight = new THREE.DirectionalLight(0xffffff, 1.2);
  keyLight.position.set(5, 8, 6);
  scene.add(keyLight);

  const fillLight1 = new THREE.DirectionalLight(0xffffff, 0.95);
  fillLight1.position.set(-5, 4, -4);
  scene.add(fillLight1);

  const fillLight2 = new THREE.DirectionalLight(0xffffff, 0.75);
  fillLight2.position.set(0, -3, 4);
  scene.add(fillLight2);

  const loader = new THREE.GLTFLoader();
  loader.load(
    glbFile,
    function (res) {
      const model = res.scene;
      scene.add(model);
      const box = new THREE.Box3().setFromObject(model);
      const center = box.getCenter(new THREE.Vector3());
      model.position.sub(center);
      controls.target.set(0,0,0);
      controls.update();

      // 拿到模型自身宽高比例
      const size = new THREE.Vector3();
      box.getSize(size);
      const modelRatio = size.x / size.y;

      // 画布基准宽度，不超过容器最大宽度
      const baseW = dom.clientWidth;
      const canvasW = baseW;
      const canvasH = canvasW / modelRatio;

      renderer.setSize(canvasW, canvasH);
      camera.aspect = canvasW / canvasH;
      camera.updateProjectionMatrix();
    },
    undefined,
    function (err) {
      console.error(err);
    }
  );

  function render() {
    requestAnimationFrame(render);
    controls.update();
    renderer.render(scene, camera);
  }
  render();
}

createModel("box1", "sofa.glb", "sofa");
createModel("box2", "bookshelf.glb", "shelf");

</script>
</body>
</html>
