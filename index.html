<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>3dmax</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
body {
  font-family: "Microsoft YaHei", "微软雅黑", Arial, sans-serif;
  background: #f0f0f0;
  padding: 15px;
}
.item {
  background: #ffffff;
  border: 2px solid #888;
  padding: 12px;
  margin-bottom: 15px;
}
.view-box {
  width: 100%;
  /* 重点：锁定16:9比例，不再固定height:340px */
  aspect-ratio: 16 / 9;
  background: #ffffff;
  border: 1px solid #bbb;
}
.desc {
  margin-top: 12px;
  line-height: 1.8;
  font-size: 15px;
  color: #222;
}
</style>
</head>
<body>
<div class="item">
  <div class="view-box" id="box1"></div>
  <div class="desc">
    <strong>沙发模型</strong><br>
    本作品参照抖音 @3dmax效果图教学 的教程完成建模。<br>
    不足之处：模型布线存在缺陷，部分结构段数较少，材质质感表现不够细腻。
  </div>
</div>

<div class="item">
  <div class="view-box" id="box2"></div>
  <div class="desc">
    <strong>书架模型</strong>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
function createModel(containerId, glbFile, type) {
  const dom = document.getElementById(containerId);
  const fixedW = dom.clientWidth;
  const fixedH = dom.clientHeight;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xffffff);

  const camera = new THREE.PerspectiveCamera(45, fixedW / fixedH, 0.1, 1000);
  if (type === "sofa") {
    camera.position.set(4, 3, 9);
  } else {
    camera.position.set(2.5, 2, 5.5);
  }

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(fixedW, fixedH);
  renderer.setPixelRatio(window.devicePixelRatio);
  dom.appendChild(renderer.domElement);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.enableRotate = true;
  controls.enableZoom = true;
  controls.enablePan = true;

  // 沙发提亮，书架亮度不变
  const ambientIntensity = type === "sofa" ? 0.9 : 0.75;
  const ambient = new THREE.AmbientLight(0xffffff, ambientIntensity);
  scene.add(ambient);

  const hemi = new THREE.HemisphereLight(0xffffff, 0xe2e2e2, 1.1);
  scene.add(hemi);
  const keyLight = new THREE.DirectionalLight(0xffffff, 1.1);
  keyLight.position.set(5, 8, 6);
  scene.add(keyLight);
  const fillLight1 = new THREE.DirectionalLight(0xffffff, 0.85);
  fillLight1.position.set(-5, 4, -4);
  scene.add(fillLight1);
  const fillLight2 = new THREE.DirectionalLight(0xffffff, 0.65);
  fillLight2.position.set(0, -3, 4);
  scene.add(fillLight2);

  const loader = new THREE.GLTFLoader();
  loader.load(
    glbFile,
    function (res) {
      const model = res.scene;
      scene.add(model);
      controls.target.copy(model.position);
      controls.update();
      console.log(glbFile + " 加载成功");
    },
    undefined,
    function (err) {
      console.error(glbFile + " 加载失败", err);
    }
  );

  function render() {
    requestAnimationFrame(render);
    controls.update();
    renderer.render(scene, camera);
  }
  render();
  // 删掉resize，不再动态更新相机
}

createModel("box1", "sofa.glb", "sofa");
createModel("box2", "bookshelf.glb", "shelf");
</script>
</body>
</html>
