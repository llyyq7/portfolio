<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>3D家具展示</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: "Microsoft YaHei", Arial, sans-serif;
  background: #f5f5f5;
  color: #222;
  overflow: hidden;
}

/* 整体上下布局 */
.container {
  width: 100vw;
  height: 100vh;
  display: flex;
  flex-direction: column;
}

/* 上方模型区 */
.model-box {
  flex: 3;
  background: #ffffff;
  border: 2px solid #ccc;
  margin: 10px 10px 5px 10px;
  position: relative;
  overflow: hidden;
}

/* 下方文字说明区 */
.text-box {
  flex: 1;
  background: #ffffff;
  border: 2px solid #ccc;
  margin: 5px 10px 10px 10px;
  padding: 15px 20px;
  overflow-y: auto;
}

h2 {
  margin-bottom: 10px;
  font-size: 20px;
}

p {
  font-size: 15px;
  line-height: 1.8;
  margin-bottom: 8px;
}

/* 让 Three.js 画布只占模型区 */
canvas {
  display: block;
  width: 100%;
  height: 100%;
  background: #ffffff;
}
</style>
</head>
<body>

<div class="container">
  <!-- 上方：模型展示区 -->
  <div class="model-box" id="modelBox"></div>

  <!-- 下方：文字说明区 -->
  <div class="text-box">
    <h2>3D模型展示说明</h2>
    <p>本页面展示沙发与书架两个三维模型，通过 Three.js 实现模型加载、场景灯光、轨道控制和页面交互。</p>
    <p>操作说明：鼠标左键拖拽可旋转模型，滚轮可缩放，右键拖拽可平移视角。</p>
    <p>模型格式为 GLB，通过 GLTFLoader 加载到场景中，并配合环境光与平行光进行照明展示。</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<script>
// 获取模型容器
const modelBox = document.getElementById("modelBox");
const boxWidth = modelBox.clientWidth;
const boxHeight = modelBox.clientHeight;

// 场景、相机、渲染器
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffffff); // 白色背景，避免黑屏

const camera = new THREE.PerspectiveCamera(45, boxWidth / boxHeight, 0.1, 1000);
camera.position.set(6, 4, 8);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(boxWidth, boxHeight);
renderer.setPixelRatio(window.devicePixelRatio);
modelBox.appendChild(renderer.domElement);

// 控制器
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

// 灯光：增强亮度，避免模型发灰发黑
const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
dirLight.position.set(5, 10, 7);
scene.add(dirLight);

const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.6);
dirLight2.position.set(-5, 3, -5);
scene.add(dirLight2);

// 加载模型
const loader = new THREE.GLTFLoader();

loader.load('sofa.glb', function (res) {
  const model = res.scene;
  model.position.set(-1.5, 0, 0);
  model.scale.set(1, 1, 1);
  scene.add(model);
}, undefined, function (error) {
  console.error('沙发模型加载失败：', error);
});

loader.load('bookshelf.glb', function (res) {
  const model = res.scene;
  model.position.set(1.5, 0, 0);
  model.scale.set(1, 1, 1);
  scene.add(model);
}, undefined, function (error) {
  console.error('书架模型加载失败：', error);
});

// 渲染循环
function render() {
  requestAnimationFrame(render);
  controls.update();
  renderer.render(scene, camera);
}
render();

// 自适应模型区大小
window.addEventListener('resize', function () {
  const newWidth = modelBox.clientWidth;
  const newHeight = modelBox.clientHeight;

  camera.aspect = newWidth / newHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(newWidth, newHeight);
});
</script>

</body>
</html>
