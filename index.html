<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>3dmax</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
body {
  font-family: "Microsoft YaHei", "微软雅黑", Arial, sans-serif;
  background: #f0f0f0;
  padding: 15px;
}
.item {
  background: #ffffff;
  border: 2px solid #888;
  padding: 12px;
  margin-bottom: 15px;
}
.view-box {
  width: 100%;
  height: 340px;
  background: #ffffff;
  border: 1px solid #bbb;
}
.desc {
  margin-top: 12px;
  line-height: 1.8;
  font-size: 15px;
  color: #222;
}
</style>
</head>
<body>
<div class="item">
  <div class="view-box" id="box1"></div>
  <div class="desc">
    <strong>沙发模型</strong><br>
    本作品参照抖音 @3dmax效果图教学 的教程完成建模。<br>
    不足之处：模型布线存在缺陷，部分结构段数分配不合理，转角位置布线杂乱；模型整体细节较少，材质质感表现不够细腻。
  </div>
</div>

<div class="item">
  <div class="view-box" id="box2"></div>
  <div class="desc">
    <strong>书架模型</strong>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
function createModel(containerId, glbFile) {
  const dom = document.getElementById(containerId);
  const w = dom.clientWidth;
  const h = dom.clientHeight;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xffffff);

  const camera = new THREE.PerspectiveCamera(45, w / h, 0.1, 100000);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(w, h);
  renderer.setPixelRatio(window.devicePixelRatio);
  dom.appendChild(renderer.domElement);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.enableRotate = true;
  controls.enableZoom = true;
  controls.enablePan = true;

  // 提亮灯光，改善深色发黑
  const ambient = new THREE.AmbientLight(0xffffff, 0.9);
  scene.add(ambient);
  const hemi = new THREE.HemisphereLight(0xffffff, 0xe8e8e8, 1.2);
  scene.add(hemi);
  const keyLight = new THREE.DirectionalLight(0xffffff, 1.2);
  keyLight.position.set(6, 10, 6);
  scene.add(keyLight);
  const fillLight1 = new THREE.DirectionalLight(0xffffff, 0.9);
  fillLight1.position.set(-6, 4, -4);
  scene.add(fillLight1);
  const fillLight2 = new THREE.DirectionalLight(0xffffff, 0.7);
  fillLight2.position.set(0, -4, 4);
  scene.add(fillLight2);

  const loader = new THREE.GLTFLoader();
  loader.load(glbFile, function (res) {
    const model = res.scene;
    scene.add(model);

    // 计算包围盒，把模型挪到中心点
    const box = new THREE.Box3().setFromObject(model);
    const center = box.getCenter(new THREE.Vector3());
    model.position.sub(center);

    const size = box.getSize(new THREE.Vector3());
    const maxDim = Math.max(size.x, size.y, size.z);
    // 相机距离，留一点边距，允许左右留白
    const fov = camera.fov * Math.PI / 180;
    const camDist = maxDim / (2 * Math.tan(fov / 2)) * 1.3;
    camera.position.set(0, 0, camDist);

    controls.target.set(0, 0, 0);
    controls.update();
    console.log(glbFile, "加载成功", size);
  }, undefined, function (err) {
    console.error(glbFile + "加载失败", err);
  });

  function render() {
    requestAnimationFrame(render);
    controls.update();
    renderer.render(scene, camera);
  }
  render();

  window.addEventListener("resize", function () {
    const nw = dom.clientWidth;
    const nh = dom.clientHeight;
    camera.aspect = nw / nh;
    camera.updateProjectionMatrix();
    renderer.setSize(nw, nh);
  });
}
createModel("box1", "sofa.glb");
createModel("box2", "bookshelf.glb");
</script>
</body>
</html>
