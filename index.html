<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>3dmax</>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
body {
  font-family: "Microsoft YaHei", sans-serif;
  background: #e8e8e8;
  padding: 15px;
}
.item {
  background: #ffffff;
  border: 2px solid #999;
  padding: 12px;
  margin-bottom: 15px;
}
.view-box {
  width: 100%;
  height: 350px;
  background: #ffffff;
  border: 1px solid #ccc;
}
.desc {
  margin-top: 12px;
  line-height: 1.8;
  font-size: 15px;
  color: #222;
}
</style>
</head>
<body>

<div class="item">
  <div class="view-box" id="box1"></div>
  <div class="desc">
    <strong>沙发模型</strong><br>
    本作品参照抖音 @3dmax效果图教学 的教程完成建模。<br>
    不足之处：模型布线存在缺陷，部分结构段数分配不合理，转角位置布线杂乱；模型整体细节较少，材质质感表现不够细腻。
  </div>
</div>

<div class="item">
  <div class="view-box" id="box2"></div>
  <div class="desc">
    <strong>书架模型</strong><br>
    本作品参照抖音 @3dmax效果图教学 的教程完成建模。<br>
    不足之处：模型布线存在缺陷，部分结构段数分配不合理，转角位置布线杂乱；模型整体细节较少，材质质感表现不够细腻。
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
// 自动居中+适配缩放，保证模型不变形、居中
function centerAndFit(model, targetSize = 4){
  const box = new THREE.Box3().setFromObject(model);
  const center = new THREE.Vector3();
  box.getCenter(center);
  model.position.sub(center);

  const size = new THREE.Vector3();
  box.getSize(size);
  const maxSide = Math.max(size.x, size.y, size.z);
  const scale = targetSize / maxSide;
  model.scale.setScalar(scale);
}

function createModel(containerId, glbFile) {
  const dom = document.getElementById(containerId);
  const w = dom.clientWidth;
  const h = dom.clientHeight;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xffffff);

  const camera = new THREE.PerspectiveCamera(45, w / h, 0.1, 1000);
  camera.position.set(0, 0, 6);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(w, h);
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.outputEncoding = THREE.sRGBEncoding;
  dom.appendChild(renderer.domElement);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.enableRotate = true;
  controls.enableZoom = true;
  controls.enablePan = true;

  const hemi = new THREE.HemisphereLight(0xffffff, 0xdddddd, 1.0);
  scene.add(hemi);
  const ambient = new THREE.AmbientLight(0xffffff, 0.6);
  scene.add(ambient);
  const mainLight = new THREE.DirectionalLight(0xffffff, 1.2);
  mainLight.position.set(5, 8, 6);
  scene.add(mainLight);
  const fillLight = new THREE.DirectionalLight(0xffffff, 0.8);
  fillLight.position.set(-5, 4, -4);
  scene.add(fillLight);
  const topLight = new THREE.DirectionalLight(0xffffff, 0.5);
  topLight.position.set(0, 10, 0);
  scene.add(topLight);

  const loader = new THREE.GLTFLoader();
  loader.load(glbFile, res => {
    const obj = res.scene;
    centerAndFit(obj, 3.5); // 自动居中、统一适配大小，不会拉伸变形
    scene.add(obj);
  });

  function render() {
    requestAnimationFrame(render);
    controls.update();
    renderer.render(scene, camera);
  }
  render();

  window.addEventListener('resize', () => {
    const nw = dom.clientWidth;
    const nh = dom.clientHeight;
    camera.aspect = nw / nh;
    camera.updateProjectionMatrix();
    renderer.setSize(nw, nh);
  });
}

createModel("box1", "sofa.glb");
createModel("box2", "bookshelf.glb");
</script>
</body>
</html>
